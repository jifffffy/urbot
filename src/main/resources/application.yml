server:
  port: 8080
  servlet:
    session:
      cookie:
        name: URBOT_SESSION

# Neo4j Database Configuration (Drivine)
database:
  datasources:
    neo:
      type: NEO4J
      host: ${NEO4J_HOST:localhost}
      port: ${NEO4J_PORT:7891}
      user-name: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:urbot123}
      database-name: ${NEO4J_DATABASE:neo4j}

neo4j:
  http:
    port: ${NEO4J_HTTP_PORT:8892}

urbot:
  # For document ingestion underpinning RAG
  ingestion:
    max-chunk-size: 800
    overlap-size: 100
    embedding-batch-size: 800

  chat:
    llm:
      # Local default: Google Gemma via Ollama. Override with URBOT_CHAT_MODEL
      # (e.g. gemini-3.6-flash when GEMINI_API_KEY is set).
      model: ${URBOT_CHAT_MODEL:gemma4:e4b}
      temperature: 0.0
    persona: assistant
    max-words: 80
    memory-eager-limit: 50
    objective: qa
    behaviour: default
    tagline: Chatbot with RAG and memory

  memory:
    enabled: true

    entity-packages: []

    extraction-llm:
      model: ${URBOT_MEMORY_MODEL:${URBOT_CHAT_MODEL:gemma4:e4b}}
      temperature: 0.0
      timeout: 240s

    entity-resolution-llm:
      model: ${URBOT_MEMORY_MODEL:${URBOT_CHAT_MODEL:gemma4:e4b}}
      temperature: 0.0
      timeout: 120s

    classify-llm:
      model: ${URBOT_FAST_MODEL:${URBOT_MEMORY_MODEL:${URBOT_CHAT_MODEL:gemma4:e4b}}}
      temperature: 0.0
    projection-llm:
      model: ${URBOT_FAST_MODEL:${URBOT_MEMORY_MODEL:${URBOT_CHAT_MODEL:gemma4:e4b}}}
      temperature: 0.0
    window-size: 20
    overlap-size: 2
    trigger-interval: 6
    show-prompts: false
    show-responses: false

management:
  health:
    neo4j:
      enabled: false  # Drivine manages its own Neo4j connection; disable Spring's default health check

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    mcp:
      client:
        enabled: true
        name: urbot
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        stdio:
          connections:
            brave-search-mcp:
              command: docker
              args:
                - run
                - -i
                - --rm
                - -e
                - BRAVE_API_KEY
                - mcp/brave-search
              env:
                BRAVE_API_KEY: ${BRAVE_API_KEY:}

embabel:

  models:
    default-llm: ${URBOT_CHAT_MODEL:gemma4:e4b}
    default-embedding-model: ${URBOT_EMBEDDING_MODEL:nomic-embed-text:v1.5}

  agent:
    platform:
      http-client:
        connect-timeout: 30s
        read-timeout: 10m
